services:
  postgres:
    image: postgres:16-alpine
    container_name: qr-menu-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-qr_menu}
      POSTGRES_USER: ${POSTGRES_USER:-qr_menu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qr_menu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-qr_menu} -d ${POSTGRES_DB:-qr_menu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: qr-menu-backend
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q 'UP'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: qr-menu-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
