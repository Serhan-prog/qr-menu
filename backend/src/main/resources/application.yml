spring:
  application:
    name: qr-menu
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qr_menu}
    username: ${DB_USERNAME:qr_menu}
    password: ${DB_PASSWORD:qr_menu}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  qr:
    public-base-url: ${PUBLIC_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:qr-menu-development-secret-key-change-this-value-in-production}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  seed:
    enabled: ${SEED_ENABLED:false}
  rate-limit:
    public-requests-per-minute: ${PUBLIC_RATE_LIMIT_PER_MINUTE:30}
  security:
    cookie-secure: ${COOKIE_SECURE:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
